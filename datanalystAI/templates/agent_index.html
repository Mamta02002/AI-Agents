<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AiDataAnalyst</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      margin: 0px;
      padding: 0px;
      background-color: #0f172a;
      color: #e2e8f0;
    }

    .sidebar {
      width: 400px;
      background-color: #1e293b;
      padding: 20px;
      box-sizing: border-box;
      border-right: 1px solid #334155;
    }

    .sidebar h2, .sidebar h3 {
      color: #f1f5f9;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chatbox {
      flex: 1;
      padding: 40px;
      overflow-y: auto;
      background-color: #0f172a;
    }

    .chat-message {
      background: #1e293b;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(30, 41, 59, 0.5);
      color: #e2e8f0;
    }

    .controls {
      padding: 10px;
      border-top: 1px solid #334155;
      background-color: #1e293b;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #2563eb;
    }

    textarea {
      width: 90%;
      height: 100px;
      margin-top: 10px;
      background-color: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 5px;
      padding: 10px;
      resize: none;
    }

    input[type="file"] {
      margin-top: 10px;
      color: #e2e8f0;
    }

    #htmlFrame {
      border: 1px solid #334155;
      height: fit-content;
      /* overflow-y: scroll; */
      padding: 10px;
      background-color: #0f172a;
      color: #e2e8f0;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Upload Data</h2>
    <input type="file" id="dataFile" />
    <h3>Context / Description</h3>
    <textarea id="contextInput" placeholder="Describe your data..."></textarea>
    <button onclick="analyzeData()">Analyze</button>
  </div>
  <div class="main">
    <div class="chatbox" id="chatbox">
      <div class="chat-message">👋 Hi! Upload your data and describe it in brief. I'll analyze it for you.</div>
    </div>
    <div class="controls">
      <!-- Optional: Add user input or chat controls here -->
    </div>
  </div>

  <script>
    let htmlContent = '';

    function analyzeData() {
      const chatbox = document.getElementById('chatbox');
      const context = document.getElementById('contextInput').value;
      const fileInput = document.getElementById('dataFile');

      if (!fileInput.files || fileInput.files.length === 0) {
          const errorMessage = document.createElement('div');
          errorMessage.className = 'chat-message';
          errorMessage.textContent = '⚠️ Error: No data file uploaded. Please upload a file before analyzing.';
          chatbox.appendChild(errorMessage);
          chatbox.scrollTop = chatbox.scrollHeight;
          return;
        }
      const formData = new FormData();

      formData.append('data', fileInput.files[0]);
      formData.append('description', context);
      formData.append('n', '2');

      const userMessage = document.createElement('div');
      userMessage.className = 'chat-message';
      userMessage.textContent = `🧠 Analyzing your data with context: "${context}"`;
      chatbox.appendChild(userMessage);

      fetch('/analyze', {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        htmlContent = data.html;

        const modelResponse = document.createElement('div');
        modelResponse.className = 'chat-message';
        modelResponse.innerHTML = `
          <h4>📊 Analysis Result</h4>
          <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
            <button onclick="downloadHTML()">Download HTML</button>
          </div>
          <div id="htmlFrame">${htmlContent}</div>
        `;
        chatbox.appendChild(modelResponse);
        chatbox.scrollTop = chatbox.scrollHeight;
      })
      .catch(error => {
        const errorMessage = document.createElement('div');
        errorMessage.className = 'chat-message';
        errorMessage.textContent = '⚠️ Error analyzing data.';
        chatbox.appendChild(errorMessage);
      });
    }

    function downloadHTML() {
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'analysis_result.html';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
